[pytest]
# Pytest configuration for chatbot component tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external resources)
    slow: Slow tests (>1 second)
    asyncio: Async tests
    skip_ci: Skip in CI environment

# Async mode
asyncio_mode = auto

# Output settings
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = .

# Coverage settings (if pytest-cov installed)
# addopts = --cov=chatbot --cov-report=html --cov-report=term

# Minimum Python version
minversion = 3.12
